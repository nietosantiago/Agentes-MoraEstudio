services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mora
      POSTGRES_PASSWORD: mora
      POSTGRES_DB: mora
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mora"]
      interval: 3s
      retries: 20
  app:
    build: .
    env_file: [.env]
    environment:
      MORA_DATABASE_URL: postgresql://mora:mora@db:5432/mora
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
volumes:
  pgdata:
